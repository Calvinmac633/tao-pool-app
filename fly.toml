# Fly.io config. The tracker runs inside the web process, so the machine
# must never stop: auto_stop_machines is off and one machine always runs.
app = "tao-pool-tracker"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  TRACKER_DB_URL = "file:/data/tracker.db"

[mounts]
  source = "tracker_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
